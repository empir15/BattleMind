<style>
        @keyframes pulse-cyan {
            0%, 100% { opacity: 0.4; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.05); }
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        @keyframes scanline {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }
        .glow-cyan {
            box-shadow: 0 0 20px rgba(73, 247, 226, 0.3);
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .bg-mesh {
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(73, 247, 226, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(107, 33, 168, 0.15) 0%, transparent 40%);
        }
        .animate-brain {
            filter: drop-shadow(0 0 15px rgba(73, 247, 226, 0.5));
            animation: float 4s ease-in-out infinite;
        }
    </style>

<body class="bg-surface-container-lowest text-on-surface overflow-hidden selection:bg-primary selection:text-on-primary">
<!-- Global Background Elements -->

<div class="absolute inset-0 bg-mesh opacity-60"></div>
<div class="absolute top-[-10%] right-[-10%] w-[40%] h-[40%] bg-primary/10 rounded-full blur-[120px]"></div>
<div class="absolute bottom-[-10%] left-[-10%] w-[40%] h-[40%] bg-secondary/10 rounded-full blur-[120px]"></div>
<!-- Scanline effect -->
<div class="absolute inset-0 opacity-[0.03] overflow-hidden pointer-events-none">
<div class="w-full h-[2px] bg-primary animate-[scanline_8s_linear_infinite]"></div>
</div>
</div>
<!-- Main Content Canvas -->
<main class="relative z-10 min-h-screen flex flex-col items-center justify-between px-container-margin py-xl lg:py-32">
<!-- Header Branding (Hidden on Mobile, simplified on desktop) -->

</div>
</div>
</header>

<!-- Animated Brain/Logo Container -->

<!-- Main Image Asset -->

<img alt="BattleMind Logo" class="w-[280px] md:w-[400px] h-auto transition-transform duration-700 group-hover:scale-110" data-alt="A futuristic eSports logo for 'BattleMind' featuring a high-tech stylized human brain with digital circuitry patterns. The artwork is illuminated with vibrant cyan and violet neon glows against a dark matte background. The aesthetic is clean, professional, and aggressive, reflecting peak cognitive performance and digital strategy. Intricate glowing paths simulate data flowing through neurons." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCNkUqSVIWyUUBd7-05uB5fWtxYRebH2EPmy3j-QfMfoaLckBf_W8OdE8BmG_yoBRmjhT4O3VCX1yiGhhRDzc_GTBXrlf2OUiOBLliXr3uf9lNZ-TyIv34Zzgy7sT3LywonEiZ3FxiT9Y8YKnxTQUwkN2bSGtRfwJAZDRtWYGhxOtV90SzPcA7Ecc0cMWTsOjcSXYlQtCW9i49F04EyhOmjtEgnYWWmiBi1M91bVz2U8keHUbXE9fEyw_EnTP_707oUcsE_sSoZpgua"/>
</div>
</div>
<!-- Title & Slogan -->
<div class="text-center space-y-md max-w-lg opacity-0 animate-[fadeInUp_1s_ease-out_0.5s_forwards]">
<h1 class="font-display-lg text-display-lg text-on-surface tracking-tighter drop-shadow-lg leading-none">
                    DOMINEZ LE <span class="text-primary italic">RÉSEAU</span>

                    Entraînez vos réflexes cognitifs dans l'arène de combat mental ultime.
                </p>
</div>

</span>

<!-- Overlay Gradients for Depth -->
<div class="fixed inset-0 z-20 pointer-events-none border-[1px] border-white/5 m-4 rounded-[2rem] lg:m-8 lg:rounded-[3rem]"></div>
<script>
        // Micro-interactions and Entrance Animations
        document.addEventListener('DOMContentLoaded', () => {
            const style = document.createElement('style');
            style.textContent = `
                @keyframes fadeInUp {
                    from { opacity: 0; transform: translateY(20px); }
                    to { opacity: 1; transform: translateY(0); }
                }
                @keyframes fadeIn {
                    from { opacity: 0; }
                    to { opacity: 1; }
                }
            `;
            document.head.appendChild(style);

            // Subtle mouse movement effect for glass layers
            window.addEventListener('mousemove', (e) => {
                const moveX = (e.clientX - window.innerWidth / 2) * 0.01;
                const moveY = (e.clientY - window.innerHeight / 2) * 0.01;
                
                const brain = document.querySelector('.animate-brain');
                if (brain) {
                    brain.style.transform = `translate(${moveX}px, ${moveY}px)`;
                }
            });
        });
    </script>
