<!-- Atmospheric Micro-interactions & Script -->
<script>
        function updatePlayerCount(delta) {
            const slider = document.getElementById('playerSlider');
            let newVal = parseInt(slider.value) + delta;
            if (newVal >= slider.min && newVal <= slider.max) {
                slider.value = newVal;
                document.getElementById('playerCountVal').innerText = newVal;
            }
        }

        function copyCode() {
            const code = document.getElementById('roomCode').innerText;
            navigator.clipboard.writeText(code).then(() => {
                alert('Code copié : ' + code);
            });
        }

        // Simple parallax effect for glass cards on mouse move (Desktop Only)
        if (window.innerWidth > 768) {
            document.addEventListener('mousemove', (e) => {
                const cards = document.querySelectorAll('.glass-card');
                const x = (e.clientX - window.innerWidth / 2) / 100;
                const y = (e.clientY - window.innerHeight / 2) / 100;
                
                cards.forEach(card => {
                    card.style.transform = `translate(${x}px, ${y}px)`;
                });
            });
        }
    </script>
