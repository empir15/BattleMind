<script>
        function selectRole(role) {
            console.log('Role selected:', role);
            // Flash effect on selection
            const body = document.body;
            const originalBg = body.style.backgroundColor;
            
            if(role === 'player') {
                body.classList.add('transition-all', 'duration-300');
                body.style.backgroundColor = 'rgba(73, 247, 226, 0.05)';
                setTimeout(() => body.style.backgroundColor = originalBg, 300);
            } else {
                body.classList.add('transition-all', 'duration-300');
                body.style.backgroundColor = 'rgba(0, 0, 0, 0.5)';
                setTimeout(() => body.style.backgroundColor = originalBg, 300);
            }
        }

        // Parallax-ish mouse interaction
        document.addEventListener('mousemove', (e) => {
            const cards = document.querySelectorAll('.glass-card, .judge-card');
            const x = (window.innerWidth / 2 - e.pageX) / 50;
            const y = (window.innerHeight / 2 - e.pageY) / 50;
            
            cards.forEach(card => {
                card.style.transform = `rotateY(${x}deg) rotateX(${-y}deg) scale(1)`;
            });
        });
    </script>
